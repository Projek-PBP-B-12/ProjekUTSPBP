<h2>Bagikan Makanan</h2>
<p>Pilih makanan dan tuliskan petunjuk pengambilannya.</p>

<form method="post" action="{% url 'sharedpost:create' %}"
    {% if is_htmx %}
        hx-post="{% url 'sharedpost:create' %}"
        hx-target="#post-form"
        hx-swap="innerHTML"
        hx-disabled-elt="find button"
    {% endif %}
>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Bagikan</button>
</form>
