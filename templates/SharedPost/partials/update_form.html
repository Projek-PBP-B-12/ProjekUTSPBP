<section class="form-panel"><h2>Edit Penawaran</h2><p class="form-intro">Perbarui lokasi dan petunjuk pengambilan makananmu.</p><form method="post" action="{% url 'sharedpost:update' post.pk %}" {% if is_htmx %}hx-post="{% url 'sharedpost:update' post.pk %}" hx-target="#post-form" hx-swap="innerHTML" hx-disabled-elt="find button"{% endif %}>{% csrf_token %}{{ form.as_p }}<p class="field-hint">Makanan pada penawaran yang sudah dibuat tidak dapat diganti.</p><div class="form-actions"><button class="button primary" type="submit">Simpan perubahan</button>{% if is_htmx %}<button class="button secondary" type="button" data-close-form>Batal</button>{% else %}<a class="button secondary" href="{% url 'sharedpost:list' %}">Batal</a>{% endif %}</div></form></section>
