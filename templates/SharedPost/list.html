{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Berbagi | TitikLapar</title>
    <script src="{% static 'js/htmx.min.js' %}" defer></script>
</head>
<body>
    <h1>Papan Berbagi</h1>

    <a href="{% url 'sharedpost:create' %}"
       hx-get="{% url 'sharedpost:create' %}"
       hx-target="#post-form"
       hx-swap="innerHTML">Bagikan makanan</a>

    <div id="post-form" aria-live="polite"></div>

    <div id="post-list" aria-live="polite"
         hx-get="{% url 'sharedpost:list' %}"
         hx-trigger="postCreated from:body"
         hx-swap="innerHTML">
        {% include "SharedPost/partials/post_list.html" %}
    </div>
</body>
</html>
